# ModelPipeline：モデルの構造
model:
  model_type: decoder_only             # 前のtokenから次のtokenを予測するモデル
  activation: gelu          # 活性化関数
  dropout: 0.0              # dropout率
  d_model: 128                         # tokenの埋め込みと隠れ状態の次元
  num_layers: 2                        # Transformerの層数
  num_heads: 4                         # 各層のattention head数（d_modelを割り切る値）
  ffn_dim: 512                         # 各層のfeed-forward networkの中間次元
  max_sequence_length: 128             # モデルが扱う系列長の上限（token数）
  use_positional_embedding: sinusoidal # sin・cosで位置を表す位置埋め込み

# TrainerPipeline：学習と保存
train:
  output_dir: runs/addition  # 最終モデルと評価結果の保存先
  num_train_epochs: 10       # 学習データ全体を繰り返し使う回数
  batch_size: 256            # 学習時に1デバイスで一度に処理する問題数
  test_batch_size: 128       # 評価時に1デバイスで一度に処理する問題数
  lr_scheduler_type: constant # 学習率を一定に保つ
  weight_decay: 0.01          # AdamWの重み減衰
  seed: 42                   # 学習の乱数シード
  learning_rate: 0.0003      # 学習率
  eval_strategy: epoch        # 学習途中の評価タイミング（no：行わない、epoch：各epoch末、steps：一定stepごと）
  save_strategy: 'no'        # 途中のcheckpointは保存しない。終了後にsrc/train.pyでモデルを保存
  save_safetensors: true     # モデルの重みをsafetensors形式で保存するか
  wandb:
    project: project-research # W&Bの記録先プロジェクト名
    group: addition           # 関連する実行をまとめるグループ名
    name: tutorial            # W&Bに表示する今回の実行名

# IOPipeline：生成済みデータの読み込み
# data.yamlのsave_dirに保存されたファイルを指定する。
data:
  train_dataset_jsonl: data/addition/train_data.jsonl # 学習用データのパス
  test_dataset_jsonl: data/addition/test_data.jsonl   # 評価用データのパス
  use_jsonl: true                                     # JSONL形式として読み込む
  lexer_config: configs/addition/lexer.yaml           # 語彙・token化の設定ファイル
